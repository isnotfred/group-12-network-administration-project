<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #edf4f8 0%, #f7f3ec 100%);
        color: #1f2937;
      }

      .login-panel {
        width: min(92vw, 380px);
        padding: 32px;
        border: 1px solid #d8dee7;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 45px rgba(31, 41, 55, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        line-height: 1.2;
      }

      p {
        margin: 0 0 24px;
        color: #5b6676;
      }

      .error-message {
        color: #b91c1c;
        margin-bottom: 12px;
        font-size: 14px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      input {
        width: 100%;
        height: 44px;
        margin-bottom: 16px;
        padding: 0 12px;
        border: 1px solid #b7c1cf;
        border-radius: 6px;
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgba(15, 108, 189, 0.2);
        border-color: #0f6cbd;
      }

      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 6px;
        background: #0f6cbd;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #0b5cab;
      }
    </style>
  </head>
  <body>
    <main class="login-panel">
      <h1>Network Admin Login</h1>
      <p>Enter a display name to open the dashboard.</p>
      <form method="post" action="/login">
        {% if error %}
        <p class="error-message">
          {{ error }}
        </p>
        {% endif %}
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="admin-12"
          autocomplete="username"
          required
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
